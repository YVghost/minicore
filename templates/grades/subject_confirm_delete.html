{% extends 'base.html' %}

{% block title %}Eliminar Materia — UDLA Notas{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header bg-danger text-white py-3">
        <i class="bi bi-exclamation-triangle me-2"></i>Confirmar eliminación
      </div>
      <div class="card-body p-4 text-center">
        <div class="text-danger fs-1 mb-3"><i class="bi bi-journal-x"></i></div>
        <h5 class="fw-bold">¿Eliminar "{{ subject.name }}"?</h5>
        <p class="text-muted">Se eliminarán todas las notas registradas en esta materia. <strong>No se puede deshacer.</strong></p>
        <form method="post" class="d-flex gap-2 justify-content-center mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Sí, eliminar</button>
          <a href="{% url 'grades:subject_list' subject.semester.pk %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
